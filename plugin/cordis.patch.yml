# Add a separate opt-in preset; existing presets and their compaction backends
# are untouched. The group gives this preset its own compaction provider.
- insert:
    - id: memory-ui
      name: '@local/dsh-memory'
    - id: memory-store
      name: '@local/dsh-memory/store'
    - id: preset-memory-beta
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: memory-beta
        name: DSH 记忆
        description: 主动记忆、自动召回、同次压缩与恢复。
        order: 90
        plugins:
          - id: memory-beta-compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: memory-beta-core
                name: '@local/dsh-memory/runtime'
